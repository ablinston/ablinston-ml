[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ablinston-ml"
version = "0.1.0"
description = "Shared data, modelling and monitoring helpers reused across my machine learning projects"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "ablinston"}]
dependencies = [
    "numpy>=2.1.3",
    "pandas>=2.3.2",
    "polars>=1.33.0",
    "zstandard>=0.23.0",
]

[project.urls]
Repository = "https://github.com/ablinston/ablinston-ml"

[project.optional-dependencies]
modelling = [
    "hyperopt>=0.2.7",
    "matplotlib>=3.10.5",
    "mlflow>=3.2.0",
    "scikit-learn>=1.7.1",
    "scipy>=1.16.1",
    "seaborn>=0.13.2",
    "shap>=0.48.0",
    "xgboost>=2.1.4",
]
monitoring = [
    "evidently",
    "whylogs>=1.6",
]
scraping = [
    "beautifulsoup4>=4.13.5",
    "requests>=2.32.5",
    "undetected-chromedriver>=3.5.5",
]
betfair = [
    "betfairlightweight>=2.21.1",
    "orjson>=3.11.4",
]
all = [
    "ablinston-ml[modelling,monitoring,scraping,betfair]",
]

[dependency-groups]
test = ["pytest>=8.4.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]